# Simple MongoDB + Node.js app stack.
#
# Production usage:
#   - Provide your own env file (or pass it via secret manager).
#   - Mount a persistent volume for MongoDB data.
#
# Usage:
#   docker compose up --build
#   docker compose --profile app up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naria_boilerplate_api
    profiles: ["app"]
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      LOG_DIR: /app/logger
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - app_logs:/app/logger
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks: [naria-network]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:7
    container_name: naria_boilerplate_mongo
    profiles: ["db", "app"]
    environment:
      MONGO_INITDB_DATABASE: app
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [naria-network]

networks:
  naria-network:
    driver: bridge

volumes:
  app_logs:
  mongo_data: