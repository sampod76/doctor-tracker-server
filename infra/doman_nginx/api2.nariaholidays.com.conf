# ==========================================================
# Cloudflare trusted proxy IP ranges
# Keep these directives outside the server blocks
# ==========================================================

# Cloudflare IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Restore the visitor IP only when the request comes
# from a trusted Cloudflare address
real_ip_header CF-Connecting-IP;
real_ip_recursive on;


# ==========================================================
# WebSocket connection mapping
# ==========================================================

map $http_upgrade $api2_connection_upgrade {
    default upgrade;
    ''      '';
}


# ==========================================================
# Rate-limit shared memory zones
# $binary_remote_addr is now the real visitor IP
# ==========================================================

limit_req_zone $binary_remote_addr zone=api2_per_ip:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=api2_connections:10m;


# ==========================================================
# Express application upstream
# ==========================================================

upstream api2_backend {
    server 127.0.0.1:5020;

    keepalive 64;
}


# ==========================================================
# HTTP server
# ACME challenge + redirect to HTTPS
# ==========================================================

server {
    listen 80;
    listen [::]:80;

    server_name api2.doctorTrackerholidays.com;

    # Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Nginx health endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;

        return 200 "ok\n";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ==========================================================
# HTTPS API server
# ==========================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name api2.doctorTrackerholidays.com;


    # ------------------------------------------------------
    # TLS certificates
    # ------------------------------------------------------

    ssl_certificate
        /etc/letsencrypt/live/api2.doctorTrackerholidays.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/api2.doctorTrackerholidays.com/privkey.pem;

    ssl_trusted_certificate
        /etc/letsencrypt/live/api2.doctorTrackerholidays.com/chain.pem;


    # ------------------------------------------------------
    # TLS configuration
    # ------------------------------------------------------

    ssl_protocols TLSv1.2 TLSv1.3;

    # TLS 1.2 cipher suites.
    # TLS 1.3 cipher suites are selected automatically by OpenSSL.
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    ssl_prefer_server_ciphers off;

    ssl_session_timeout 10m;
    ssl_session_cache shared:API2_SSL:20m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;

    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;


    # ------------------------------------------------------
    # Security headers
    # ------------------------------------------------------

    add_header Strict-Transport-Security
        "max-age=31536000; includeSubDomains"
        always;

    add_header X-Frame-Options
        "SAMEORIGIN"
        always;

    add_header X-Content-Type-Options
        "nosniff"
        always;

    add_header Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    add_header Content-Security-Policy
        "default-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'"
        always;

    add_header Permissions-Policy
        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=()"
        always;

    # Prevent browsers and Cloudflare from caching API responses
    add_header Cache-Control
        "no-store"
        always;


    # ------------------------------------------------------
    # Request settings
    # ------------------------------------------------------

    client_max_body_size 50m;


    # ------------------------------------------------------
    # Gzip compression
    # ------------------------------------------------------

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;

    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/xml;


    # ------------------------------------------------------
    # HTTPS health endpoint
    # Not proxied and not rate-limited
    # ------------------------------------------------------

    location = /healthz {
        access_log off;
        default_type text/plain;

        return 200 "ok\n";
    }


    # ------------------------------------------------------
    # Proxy requests to Express
    # ------------------------------------------------------

    location / {
        # Rate limit using the restored real visitor IP
        limit_req zone=api2_per_ip burst=100 nodelay;
        limit_req_status 429;

        # Maximum concurrent requests per visitor IP
        limit_conn api2_connections 30;
        limit_conn_status 429;

        proxy_pass http://api2_backend;
        proxy_http_version 1.1;

        # Original host
        proxy_set_header Host $host;

        # Clean and trusted forwarding headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Cloudflare request information
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $api2_connection_upgrade;

        # Timeouts
        proxy_connect_timeout 15s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        # Supports WebSocket, SSE and streaming responses
        proxy_buffering off;

        # Avoid duplicate Cache-Control from Express
        proxy_hide_header Cache-Control;
    }


    # ------------------------------------------------------
    # Block hidden files
    # ------------------------------------------------------

    location ~ /\.(?!well-known) {
        deny all;
    }


    # ------------------------------------------------------
    # Logging
    # ------------------------------------------------------

    access_log
        /var/log/nginx/api2.doctorTrackerholidays.com.access.log;

    error_log
        /var/log/nginx/api2.doctorTrackerholidays.com.error.log;
}