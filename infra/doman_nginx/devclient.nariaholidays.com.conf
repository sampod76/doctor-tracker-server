# ==========================================================
# WebSocket / Next.js connection mapping
# Must remain outside server blocks
# ==========================================================

map $http_upgrade $dashboard_connection_upgrade {
    default upgrade;
    ''      '';
}


# ==========================================================
# HTTP server
# ==========================================================

server {
    listen 80;
    listen [::]:80;

    server_name
        devclient.doctorTrackerholidays.com
        www.devclient.doctorTrackerholidays.com;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Canonical HTTPS redirect
    location / {
        return 301 https://devclient.doctorTrackerholidays.com$request_uri;
    }
}


# ==========================================================
# HTTPS Next.js dashboard
# ==========================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name
        devclient.doctorTrackerholidays.com
        www.devclient.doctorTrackerholidays.com;




    # ------------------------------------------------------
    # TLS configuration
    # ------------------------------------------------------

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL_dashboard:20m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;


    # ------------------------------------------------------
    # Security headers
    # ------------------------------------------------------

    add_header Strict-Transport-Security
        "max-age=31536000; includeSubDomains"
        always;

    add_header X-Frame-Options
        "SAMEORIGIN"
        always;

    add_header X-Content-Type-Options
        "nosniff"
        always;

    add_header Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    add_header Permissions-Policy
        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=()"
        always;


    # ------------------------------------------------------
    # Request configuration
    # ------------------------------------------------------

    client_max_body_size 20m;


    # ------------------------------------------------------
    # Redirect www to non-www
    # ------------------------------------------------------

    if ($host = www.devclient.doctorTrackerholidays.com) {
        return 301 https://devclient.doctorTrackerholidays.com$request_uri;
    }


    # ------------------------------------------------------
    # Proxy to Next.js
    # ------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        # Request host
        proxy_set_header Host $host;

        # Real visitor IP restored through Cloudflare real-IP config
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Original request information
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Cloudflare metadata
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;

        # WebSocket and development HMR support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dashboard_connection_upgrade;

        # Next.js SSR and streaming timeouts
        proxy_connect_timeout 15s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        # Supports Next.js streaming responses
        proxy_buffering off;
    }


    # ------------------------------------------------------
    # Block hidden files
    # ------------------------------------------------------

    location ~ /\.(?!well-known) {
        deny all;
    }


    # ------------------------------------------------------
    # Logs
    # ------------------------------------------------------

    access_log
        /var/log/nginx/devclient.doctorTrackerholidays.com.access.log;

    error_log
        /var/log/nginx/devclient.doctorTrackerholidays.com.error.log;
        #  sudo ln -s /etc/nginx/sites-available/devclient.doctorTrackerholidays.com.conf /etc/nginx/sites-enabled/devclient.doctorTrackerholidays.com.conf

}